<title>Passage Router — SF → Honolulu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --abyss: #061019;
    --deep: #0a1c28;
    --grid: rgba(86, 152, 168, 0.16);

    --amber: #ffb13b;

    --green: #5fe39a;
    --panel: rgba(8, 22, 31, 0.82);
    --hairline: rgba(63, 205, 224, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--abyss); overflow: hidden; }
  body { font-family: 'Saira', sans-serif; color: var(--ink); }
  canvas { display: block; position: fixed; inset: 0; cursor: crosshair; }

  .panel {

    border: 1px solid var(--hairline);

  }
  #controls { top: 18px; left: 18px; width: 248px; }
  #controls h1 {
    font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase;
    margin: 0 0 2px; font-weight: 600; color: var(--cyan);
  }
  #controls .sub {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;

  }
  .layer { display: flex; align-items: center; gap: 9px; padding: 4px 0; cursor: pointer; user-select: none; }
  .layer input { appearance: none; width: 30px; height: 16px; border-radius: 9px;

  .layer input:checked { background: rgba(63,205,224,0.32); }
  .layer input::after { content: ''; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px;
    border-radius: 50%; background: #7d9aa3; transition: transform .2s, background .2s; }
  .layer input:checked::after { transform: translateX(14px); background: var(--cyan); }
  .layer span { font-size: 13px; letter-spacing: 0.04em; }

  .hint { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.07);

  .hint b { color: var(--amber); font-weight: 500; }
  #reset { margin-top: 10px; width: 100%; background: transparent; color: var(--cyan);
    border: 1px solid var(--hairline); border-radius: 2px; padding: 7px; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; transition: background .15s; }
  #reset:hover { background: rgba(63,205,224,0.1); }
  #geo { margin-top: 12px; width: 100%; background: var(--cyan); color: var(--abyss);
    border: 1px solid var(--cyan); border-radius: 2px; padding: 8px; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; transition: filter .15s; font-weight: 500; }
  #geo:hover { filter: brightness(1.12); }
  #track { margin-top: 12px; width: 100%; background: transparent; color: var(--cyan);
    border: 1px solid var(--hairline); border-radius: 2px; padding: 8px; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; transition: background .15s; }
  #track:hover { background: rgba(63,205,224,0.1); }
  #track.active { background: var(--amber); color: var(--abyss); border-color: var(--amber); font-weight: 500; }
  #livehud { top: 18px; right: 18px; width: 198px; font-family: 'IBM Plex Mono', monospace; }
  #livehud .hud-title { display: flex; align-items: center; gap: 7px; font-family: 'Saira', sans-serif; font-weight: 600;
    font-size: 12px; letter-spacing: 0.08em; color: var(--cyan); margin-bottom: 10px; text-transform: uppercase; }
  #livehud .hud-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: hudpulse 1.6s infinite; }
  @keyframes hudpulse { 0%{box-shadow:0 0 0 0 rgba(95,227,154,0.5);} 70%{box-shadow:0 0 0 7px rgba(95,227,154,0);} 100%{box-shadow:0 0 0 0 rgba(95,227,154,0);} }
  #livehud .hrow { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; padding: 2.5px 0; }
  #livehud .hrow .k { color: var(--grid-text); text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.05em; align-self: center; }

  #boatdot { position: fixed; z-index: 6; pointer-events: none; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; background: var(--cyan); border: 2px solid #061019; animation: boatpulse 1.6s infinite; }
  @keyframes boatpulse { 0%{box-shadow:0 0 0 0 rgba(63,205,224,0.55);} 70%{box-shadow:0 0 0 13px rgba(63,205,224,0);} 100%{box-shadow:0 0 0 0 rgba(63,205,224,0);} }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(3,8,13,0.66); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-backdrop[hidden] { display: none; }
  .modal { background: linear-gradient(180deg, var(--deep), var(--abyss)); border: 1px solid rgba(63,205,224,0.28);

  .modal-title { font-family: 'Saira', sans-serif; font-weight: 600; color: var(--cyan); font-size: 15px; margin-bottom: 12px; }

  #geo-close:hover { background: rgba(63,205,224,0.1); }
  #controls .status { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.04em; margin: 8px 0 2px; }
  .status.live { color: var(--green); } .status.demo { color: var(--amber); } .status.load { color: var(--grid-text); }
  #controls .boatrow { display: flex; gap: 6px; margin: 7px 0 3px; }
  #controls select#boat { flex: 1; min-width: 0; background: rgba(255,255,255,0.05); color: var(--ink);

    border: 1px solid rgba(63,205,224,0.35); border-radius: 5px; padding: 5px 9px; display: flex; align-items: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  #controls .upload:hover { background: rgba(63,205,224,0.18); }
  #controls .certmsg { font-family: 'IBM Plex Mono', monospace; font-size: 10px; min-height: 12px; margin-bottom: 2px; color: var(--grid-text); }
  #controls .certmsg.ok { color: var(--green); } #controls .certmsg.err { color: var(--amber); }

  #controls .efflabel { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--grid-text); margin-bottom: 5px; letter-spacing: 0.04em; }

  #timewrap { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.07); }

  #telemetry { bottom: 18px; left: 18px; min-width: 248px; font-family: 'IBM Plex Mono', monospace; }
  #telemetry .row { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; letter-spacing: 0.03em; }
  #telemetry .row .k { color: var(--grid-text); }
  #telemetry .row .v { color: var(--ink); }

  #cursor { position: fixed; z-index: 6; pointer-events: none; background: var(--panel);
    border: 1px solid var(--hairline); border-radius: 2px; padding: 6px 9px; font-family: 'IBM Plex Mono', monospace;

<canvas id="map"></canvas>

<div class="panel" id="controls">
  <h1>Passage Router</h1>

  <div class="boatrow">

<script>
// ============================ geometry (spherical) ============================
const R_NM = 3440.065, toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
function distNm(a,b){const f1=toRad(a.lat),f2=toRad(b.lat),df=toRad(b.lat-a.lat),dl=toRad(b.lon-a.lon);
  const h=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;return 2*R_NM*Math.asin(Math.min(1,Math.sqrt(h)));}
function bearing(a,b){const f1=toRad(a.lat),f2=toRad(b.lat),dl=toRad(b.lon-a.lon);
  const y=Math.sin(dl)*Math.cos(f2),x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
  return (toDeg(Math.atan2(y,x))+360)%360;}
function gcProject(a,brg,d){const dr=d/R_NM,th=toRad(brg),f1=toRad(a.lat),l1=toRad(a.lon);
  const f2=Math.asin(Math.sin(f1)*Math.cos(dr)+Math.cos(f1)*Math.sin(dr)*Math.cos(th));
  const l2=l1+Math.atan2(Math.sin(th)*Math.sin(dr)*Math.cos(f1),Math.cos(dr)-Math.sin(f1)*Math.sin(f2));
  return {lat:toDeg(f2),lon:((toDeg(l2)+540)%360)-180};}
const vec=(b,s)=>({x:Math.sin(toRad(b))*s,y:Math.cos(toRad(b))*s});
const brgOf=(x,y)=>(toDeg(Math.atan2(x,y))+360)%360;
const angDiff=(a,b)=>Math.abs((((a-b)%360)+540)%360-180);

// ============================ boat library: built-in ORR/ORC polars + uploaded ORR certs ============================
const BOATS = {
  sc40:{name:"Santa Cruz 40",meta:"Quiver \u00b7 ORR US43259",loa:12.19,polar:{"tws":[4,6,8,10,12,14,16,20,24],"twa":[52,60,75,90,110,120,135,150,165,180],"speed":[[4.05,5.71,6.9,7.49,7.78,7.97,8.1,8.26,8.34],[4.47,6.15,7.27,7.78,8.04,8.22,8.35,8.51,8.6],[4.91,6.62,7.58,8.09,8.37,8.57,8.72,8.92,9.04],[4.96,6.66,7.61,8.15,8.55,8.82,9.01,9.27,9.51],[4.44,6.03,7.37,8.12,8.67,9.12,9.43,9.99,10.5],[4.01,5.89,7.24,7.98,8.54,9.04,9.52,10.37,11.09],[3.45,5.07,6.52,7.43,7.99,8.47,8.93,9.96,11.47],[2.59,3.93,5.15,6.3,7.21,7.8,8.28,9.18,10.23],[2.16,3.3,4.39,5.44,6.4,7.2,7.77,8.67,9.54],[1.99,3.04,4.06,5.04,5.97,6.79,7.44,8.36,9.18]],"beat":{"angle":[47.7,45.6,44.0,41.9,39.4,37.6,37.6,35.0,34.7],"speed":[3.76,5.21,6.19,6.79,7.02,7.17,7.26,7.38,7.44]}}},
  tp52:{name:"TP52",meta:"SUMMER STORM \u00b7 ORC USA USA520",loa:15.848,polar:{"tws":[4,6,8,10,12,14,16,20,24],"twa":[52,60,75,90,110,120,135,150],"speed":[[6.0,7.9,9.06,9.58,9.98,10.31,10.58,10.99,11.13],[6.48,8.37,9.44,10.05,10.51,10.89,11.2,11.67,11.93],[6.82,8.73,9.81,10.69,11.28,11.78,12.21,12.92,13.45],[6.73,8.61,9.72,10.79,11.75,12.48,13.11,14.22,15.03],[6.22,8.23,9.62,10.82,11.87,12.71,13.51,15.5,17.0],[5.75,7.81,9.38,10.65,11.83,13.1,14.19,15.92,17.44],[4.82,6.98,8.85,10.09,11.44,12.93,14.4,16.68,19.54],[3.98,5.82,7.5,8.79,9.87,11.09,12.54,15.71,19.45]],"beat":{"angle":[43.4,43.4,40.5,39,37.8,37.1,36.4,36.4,37.5],"speed":[5.22,7.1,8.07,8.54,8.8,8.99,9.11,9.34,9.47]}}},
  sunfast3300:{name:"Sun Fast 3300",meta:"LOW PROFILE \u00b7 ORC USA USA70330",loa:10.0,polar:{"tws":[4,6,8,10,12,14,16,20,24],"twa":[52,60,75,90,110,120,135,150],"speed":[[4.16,5.54,6.46,6.98,7.27,7.41,7.51,7.62,7.63],[4.42,5.81,6.68,7.17,7.46,7.67,7.8,7.96,7.99],[4.6,6.0,6.83,7.31,7.68,7.99,8.23,8.52,8.66],[4.65,6.12,7.04,7.57,7.99,8.27,8.48,9.04,9.43],[4.54,6.08,7.13,7.77,8.33,8.78,9.19,10.08,10.9],[4.43,5.98,7.07,7.72,8.33,8.96,9.57,10.61,12.62],[3.75,5.32,6.6,7.37,7.95,8.56,9.28,11.32,14.46],[3.14,4.47,5.64,6.63,7.35,7.85,8.35,9.72,13.43]],"beat":{"angle":[43,43,40.6,38.9,38.8,38.4,38.2,38.5,40.3],"speed":[3.62,4.99,5.8,6.26,6.58,6.7,6.77,6.85,6.92]}}},
  cape31:{name:"Cape 31",meta:"Full Send \u00b7 ORC USA USA7361",loa:9.573,polar:{"tws":[6,8,10,12,14,16,20],"twa":[52,60,75,90,110,120,135,150],"speed":[[5.91,6.93,7.43,7.68,7.84,7.97,8.1],[6.22,7.14,7.72,8.05,8.26,8.41,8.59],[6.45,7.28,7.99,8.59,8.92,9.17,9.52],[6.71,7.65,8.27,8.74,9.48,9.95,10.59],[6.58,7.61,8.61,9.49,10.13,10.71,11.73],[6.28,7.48,8.49,9.48,10.55,11.35,12.79],[5.56,7.0,7.97,9.07,10.35,11.64,13.9],[4.68,5.96,7.01,7.93,8.89,10.05,13.11]],"beat":{"angle":[42.4,40.2,38.2,37.5,37,36.9,37],"speed":[5.28,6.22,6.63,6.81,6.9,6.97,7.04]}}},
};
const BOAT_ORDER = ["sc40","tp52","sunfast3300","cape31"];
let POLAR = BOATS.sc40.polar;
let POLAR_EFF = 0.90;   // fraction of VPP target speed actually achieved (helming, sail changes, crew, seaway)
const lerp=(a,b,t)=>a+(b-a)*t;
function interp1(xs,ys,x){if(x<=xs[0])return ys[0];if(x>=xs[xs.length-1])return ys[ys.length-1];
  let i=1;while(xs[i]<x)i++;return lerp(ys[i-1],ys[i],(x-xs[i-1])/(xs[i]-xs[i-1]));}
function colSpeed(w,twa){const ang=[0,POLAR.beat.angle[w],...POLAR.twa];
  const sp=[0,POLAR.beat.speed[w],...POLAR.speed.map(r=>r[w])];return interp1(ang,sp,twa);}
function polarSpeed(tws,twaRaw){let twa=((twaRaw%360)+360)%360;if(twa>180)twa=360-twa;
  const T=POLAR.tws,t=Math.max(T[0],Math.min(T[T.length-1],tws));let w=1;while(w<T.length-1&&T[w]<t)w++;
  const f=(t-T[w-1])/(T[w]-T[w-1]);return lerp(colSpeed(w-1,twa),colSpeed(w,twa),f);}

// ============================ wave-speed penalty ============================
const WAVE={k:0.40,a:1.5,b:1.0,A:0.45,B:0.55,minMult:0.40,maxMult:1.08};
function waveMult(Hs,T,waveDir,heading){if(!Hs||!T)return 1;
  const beta=toRad(angDiff(waveDir,heading)),fA=WAVE.A+WAVE.B*Math.cos(beta);
  const p=WAVE.k*Math.pow(Hs,WAVE.a)*Math.pow(T,-WAVE.b)*fA;return Math.min(WAVE.maxMult,Math.max(WAVE.minMult,1-p));}

// ============================ environment: live forecast, synthetic fallback ============================
// getEnv(lat,lon,t) is the single source the router + renderer read. It uses a live
// Open-Meteo sampler when the fetch succeeds, otherwise a synthetic North Pacific High
// so the demo always works offline.
let SAMPLER=null, FIELD='synthetic', DISP_T=0, EPOCH0=Math.floor(Date.now()/1000), HORIZON_H=192, MAXT=384;
const HIGH={lat:37,lon:-147};
function synthEnv(lat,lon){ // clockwise circulation around a high with a calm core
  const d=distNm(HIGH,{lat,lon}), brg=bearing(HIGH,{lat,lon}), twd=(brg+270)%360;
  const tws=Math.min(27,27*(1-Math.exp(-d/520)));
  return {tws,twd,waveHeight:0.18*tws+0.7,wavePeriod:5+tws/3.5,waveDir:twd,curSpeed:0.3,curDir:270};}
function getEnv(lat,lon,t){return (FIELD==='live'&&SAMPLER)?SAMPLER(lat,lon,t||0):synthEnv(lat,lon);}

// ---- Open-Meteo pipeline (inlined from forecast.js): fetch wind + marine over the
//      corridor, pack into a grid, expose a bilinear-in-space / linear-in-time sampler ----
const TO_KT={kn:1,kmh:0.539957,'km/h':0.539957,ms:1.943844,'m/s':1.943844,mph:0.868976};
function bboxFor(pts,m=3,pole=4){const la=pts.map(p=>p.lat),lo=pts.map(p=>p.lon);
  return {south:Math.min(...la)-m,north:Math.max(...la)+m+pole,west:Math.min(...lo)-m,east:Math.max(...lo)+m};}
function buildGrid(b,step){const nLat=Math.max(2,Math.ceil((b.north-b.south)/step)+1),nLon=Math.max(2,Math.ceil((b.east-b.west)/step)+1);
  const lats=[],lons=[];for(let iy=0;iy<nLat;iy++)for(let ix=0;ix<nLon;ix++){lats.push(+(b.south+iy*step).toFixed(2));lons.push(+(b.west+ix*step).toFixed(2));}
  return {lat0:b.south,lon0:b.west,dLat:step,dLon:step,nLat,nLon,nPts:nLat*nLon,lats,lons};}
async function omFetch(base,grid,params,signal){
  const q=new URLSearchParams({latitude:grid.lats.join(','),longitude:grid.lons.join(','),timeformat:'unixtime',cell_selection:'sea',...params});
  const r=await fetch(base+'?'+q.toString(),{signal});if(!r.ok)throw new Error(base+' HTTP '+r.status);
  const jx=await r.json();return Array.isArray(jx)?jx:[jx];}
async function fetchForecastGrid({start,dest,step=1.5,windDays=14,marineDays=8,signal}){
  const grid=buildGrid(bboxFor([start,dest]),step);
  const [wind,marine]=await Promise.all([
    omFetch('https://api.open-meteo.com/v1/forecast',grid,{hourly:'wind_speed_10m,wind_direction_10m',wind_speed_unit:'kn',forecast_days:String(windDays)},signal),
    omFetch('https://marine-api.open-meteo.com/v1/marine',grid,{hourly:'wave_height,wave_direction,wave_period,ocean_current_velocity,ocean_current_direction',length_unit:'metric',forecast_days:String(marineDays)},signal)]);
  const nLat=grid.nLat,nLon=grid.nLon,nPts=grid.nPts, epoch0=wind[0].hourly.time[0], master=wind[0].hourly.time;
  const times=master.map(t=>(t-epoch0)/3600), nT=times.length;
  const mE=marine[0].hourly.time, mLast=mE.length-1, mAt=e=>Math.max(0,Math.min(mLast,Math.round((e-mE[0])/3600)));
  const curK=TO_KT[marine[0].hourly_units&&marine[0].hourly_units.ocean_current_velocity]||1;
  const N=nT*nLat*nLon, F=()=>new Float32Array(N), num=v=>(v==null||Number.isNaN(v)?0:v);
  const env={epoch0,times,lat0:grid.lat0,lon0:grid.lon0,dLat:grid.dLat,dLon:grid.dLon,nLat,nLon,marineHorizonHours:(mE[mLast]-epoch0)/3600,
    tws:F(),waveHeight:F(),wavePeriod:F(),curSpeed:F(),twd_x:F(),twd_y:F(),waveDir_x:F(),waveDir_y:F(),curDir_x:F(),curDir_y:F()};
  const sd=(xa,ya,o,deg)=>{const d=num(deg)*Math.PI/180;xa[o]=Math.sin(d);ya[o]=Math.cos(d);};
  for(let k=0;k<nPts;k++){const iy=Math.floor(k/nLon),ix=k%nLon,w=wind[k].hourly,m=marine[k].hourly;
    for(let ti=0;ti<nT;ti++){const o=(ti*nLat+iy)*nLon+ix,mi=mAt(master[ti]);
      env.tws[o]=num(w.wind_speed_10m[ti]);sd(env.twd_x,env.twd_y,o,w.wind_direction_10m[ti]);
      env.waveHeight[o]=num(m.wave_height[mi]);env.wavePeriod[o]=num(m.wave_period[mi]);sd(env.waveDir_x,env.waveDir_y,o,m.wave_direction[mi]);
      env.curSpeed[o]=num(m.ocean_current_velocity[mi])*curK;sd(env.curDir_x,env.curDir_y,o,m.ocean_current_direction[mi]);}}
  return env;}
function makeSampler(env){const times=env.times,nLat=env.nLat,nLon=env.nLon, idx=(ti,iy,ix)=>(ti*nLat+iy)*nLon+ix;
  const bil=(a,ti,iy,ix,fy,fx)=>{const p=a[idx(ti,iy,ix)]+(a[idx(ti,iy,ix+1)]-a[idx(ti,iy,ix)])*fx,
    q=a[idx(ti,iy+1,ix)]+(a[idx(ti,iy+1,ix+1)]-a[idx(ti,iy+1,ix)])*fx;return p+(q-p)*fy;};
  return (lat,lon,t)=>{const gy=(lat-env.lat0)/env.dLat,gx=(lon-env.lon0)/env.dLon;
    const iy=Math.max(0,Math.min(nLat-2,Math.floor(gy))),ix=Math.max(0,Math.min(nLon-2,Math.floor(gx)));
    const fy=Math.min(1,Math.max(0,gy-iy)),fx=Math.min(1,Math.max(0,gx-ix));
    let ti=0;while(ti<times.length-2&&times[ti+1]<t)ti++;const ft=Math.min(1,Math.max(0,(t-times[ti])/(times[ti+1]-times[ti])));
    const sc=n=>{const a=bil(env[n],ti,iy,ix,fy,fx),b=bil(env[n],ti+1,iy,ix,fy,fx);return a+(b-a)*ft;};
    const dr=n=>{const ax=bil(env[n+'_x'],ti,iy,ix,fy,fx),ay=bil(env[n+'_y'],ti,iy,ix,fy,fx),
      bx=bil(env[n+'_x'],ti+1,iy,ix,fy,fx),by=bil(env[n+'_y'],ti+1,iy,ix,fy,fx),x=ax+(bx-ax)*ft,y=ay+(by-ay)*ft;
      return (Math.atan2(x,y)*180/Math.PI+360)%360;};
    return {tws:sc('tws'),twd:dr('twd'),waveHeight:sc('waveHeight'),wavePeriod:sc('wavePeriod'),waveDir:dr('waveDir'),curSpeed:sc('curSpeed'),curDir:dr('curDir')};};}

// ============================ isochrone engine ============================
function boatStep(node,h,dt){const e=getEnv(node.lat,node.lon,node.t);
  let stw=polarSpeed(e.tws,angDiff(e.twd,h))*waveMult(e.waveHeight,e.wavePeriod,e.waveDir,h)*POLAR_EFF;
  if(!(stw>0))return null;const boat=vec(h,stw),cur=vec(e.curDir,e.curSpeed);
  const sx=boat.x+cur.x,sy=boat.y+cur.y,sog=Math.hypot(sx,sy);
  const p=gcProject(node,brgOf(sx,sy),sog*dt);return {lat:p.lat,lon:p.lon,t:node.t+dt,parent:node};}
function prune(c,start,sec){const best=new Map();for(const n of c){const key=Math.round(bearing(start,n)/sec);
  const d=distNm(start,n),cur=best.get(key);if(!cur||d>cur._d){n._d=d;best.set(key,n);}}return [...best.values()];}
function backtrack(n){const p=[];for(;n;n=n.parent)p.push({lat:n.lat,lon:n.lon,t:n.t});return p.reverse();}
function route(start,dest){
  const dt=3,hStep=8,sec=2,maxH=384,maxSog=16;
  let front=[{lat:start.lat,lon:start.lon,t:0,parent:null}];const isochrones=[];
  for(let el=0;el<maxH;el+=dt){
    const cands=[];let finish=null;
    for(const node of front)for(let h=0;h<360;h+=hStep){const nn=boatStep(node,h,dt);if(!nn)continue;
      if(legHitsLand(node,nn))continue;                  // reject legs that cross land, not just endpoints on land
      cands.push(nn);if(distNm(nn,dest)<=dt*maxSog&&!legHitsLand(nn,dest)&&(!finish||nn.t<finish.t))finish=nn;}
    if(finish){isochrones.push(front);
      const fe=getEnv(finish.lat,finish.lon,finish.t), fh=bearing(finish,dest);
      const fstw=polarSpeed(fe.tws,angDiff(fe.twd,fh))*waveMult(fe.waveHeight,fe.wavePeriod,fe.waveDir,fh)*POLAR_EFF;
      const fb=vec(fh,fstw), fc=vec(fe.curDir,fe.curSpeed), fsog=Math.hypot(fb.x+fc.x,fb.y+fc.y);
      const legT=fsog>0?distNm(finish,dest)/fsog:distNm(finish,dest)/maxSog;
      const dst={lat:dest.lat,lon:dest.lon,t:finish.t+legT,parent:finish};
      return {track:backtrack(dst),hours:dst.t,isochrones,reached:true};}
    front=prune(cands,start,sec);isochrones.push(front);if(!front.length)break;}
  let best=null,bd=1e9;for(const n of front){const d=distNm(n,dest);if(d<bd){bd=d;best=n;}}
  return {track:best?backtrack(best):[],hours:best?best.t:0,isochrones,reached:false};
}

// ============================ projection + colour ============================
const VIEW={latMin:16,latMax:42.5,lonMin:-160.5,lonMax:-116};
const SF={lat:37.60,lon:-122.90}, DEST={lat:21.4806,lon:-157.7725}; // SF outside the Gate; Kaneohe Bay, windward Oahu
// (wave/current horizon, hours; HORIZON_H is set from live data, default 8 days)
let W=0,H=0;
const px=(lat,lon)=>[(lon-VIEW.lonMin)/(VIEW.lonMax-VIEW.lonMin)*W,(VIEW.latMax-lat)/(VIEW.latMax-VIEW.latMin)*H];
const unpx=(x,y)=>({lat:VIEW.latMax-y/H*(VIEW.latMax-VIEW.latMin),lon:VIEW.lonMin+x/W*(VIEW.lonMax-VIEW.lonMin)});

let MASK=null, LANDCANVAS=null;
function maskLand(lat,lon){if(!MASK)return false;
  const ix=Math.floor((lon-VIEW.lonMin)/(VIEW.lonMax-VIEW.lonMin)*MASK.nx);
  const iy=Math.floor((VIEW.latMax-lat)/(VIEW.latMax-VIEW.latMin)*MASK.ny);
  if(ix<0||iy<0||ix>=MASK.nx||iy>=MASK.ny)return false;   // outside the view = open ocean
  return MASK.data[iy*MASK.nx+ix]===1;}

    if(maskLand(a.lat+(b.lat-a.lat)*t,a.lon+(b.lon-a.lon)*t))return true;}return false;}

function loadMask(done){const img=new Image();img.onload=()=>{
  const nx=img.naturalWidth, ny=img.naturalHeight;
  const oc=document.createElement('canvas');oc.width=nx;oc.height=ny;
  oc.getContext('2d').drawImage(img,0,0);
  const rgba=oc.getContext('2d').getImageData(0,0,nx,ny).data, data=new Uint8Array(nx*ny);
  const lc=document.createElement('canvas');lc.width=nx;lc.height=ny;
  const lctx=lc.getContext('2d'), tint=lctx.createImageData(nx,ny);
  for(let i=0;i<nx*ny;i++){const land=rgba[i*4]>127;data[i]=land?1:0;const o=i*4;
    tint.data[o]=28;tint.data[o+1]=40;tint.data[o+2]=34;tint.data[o+3]=land?242:0;}
  lctx.putImageData(tint,0,0);MASK={nx,ny,data};LANDCANVAS=lc;done();};
  img.src=MASK_PNG;}

const WIND_STOPS=[[0,[43,74,90]],[8,[46,154,166]],[14,[79,208,199]],[20,[255,209,102]],[28,[255,107,94]]];
function windColor(s){let lo=WIND_STOPS[0],hi=WIND_STOPS[WIND_STOPS.length-1];
  for(let i=0;i<WIND_STOPS.length-1;i++)if(s>=WIND_STOPS[i][0]&&s<=WIND_STOPS[i+1][0]){lo=WIND_STOPS[i];hi=WIND_STOPS[i+1];break;}
  const t=(s-lo[0])/(hi[0]-lo[0]||1),c=lo[1].map((v,i)=>Math.round(lerp(v,hi[1][i],Math.max(0,Math.min(1,t)))));

// A gybe = the wind crosses the stern: the tack (sign of the wind-vs-heading angle)
// flips while sailing downwind (|angle| stays > 90). A tack flips it upwind (|angle|→0).
function gybes(tr){const g=[];if(tr.length<3)return g;const rel=[];
  for(let s=0;s<tr.length-1;s++){const h=bearing(tr[s],tr[s+1]),e=getEnv(tr[s].lat,tr[s].lon);
    rel.push(((e.twd-h+540)%360)-180);}
  for(let s=1;s<rel.length;s++)
    if(Math.sign(rel[s-1])!==Math.sign(rel[s])&&Math.min(Math.abs(rel[s-1]),Math.abs(rel[s]))>90)g.push(tr[s]);
  return g;}

// Sail wardrobe for the Santa Cruz 40 (cert: symmetric spinnaker, no asym).
function sailFor(twa,tws){
  if(twa<42) return 'Pinching — no drive';
  if(twa<70) return 'Main + Genoa — close-hauled';
  if(twa<90) return 'Main + Genoa — close reach';
  if(twa<110) return tws>22?'Main + Jib — beam reach':'Main + Genoa — beam reach';
  if(twa<150) return tws>24?'Main + poled jib — heavy air':'Spinnaker (sym) — broad reach';
  return tws>24?'Main + poled jib — heavy air':'Spinnaker (sym) — running deep';
}
// Closest point on the route polyline to the cursor (screen space).
function nearestOnTrack(mx,my){if(!result||result.track.length<2)return null;const tr=result.track;let best=null;
  for(let i=0;i<tr.length-1;i++){const[x1,y1]=px(tr[i].lat,tr[i].lon),[x2,y2]=px(tr[i+1].lat,tr[i+1].lon);
    const dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy||1;let t=Math.max(0,Math.min(1,((mx-x1)*dx+(my-y1)*dy)/L2));
    const qx=x1+dx*t,qy=y1+dy*t,d=Math.hypot(mx-qx,my-qy);
    if(!best||d<best.d)best={d,x:qx,y:qy,lat:tr[i].lat+(tr[i+1].lat-tr[i].lat)*t,
      lon:tr[i].lon+(tr[i+1].lon-tr[i].lon)*t,heading:bearing(tr[i],tr[i+1]),t:tr[i].t+(tr[i+1].t-tr[i].t)*t};}
  return best;}

// reconstruct visual text rows from pdf.js items: cluster by y (3pt), order each row by x
function linesFromContent(items){
  const its=items.map(it=>({x:it.transform[4],y:it.transform[5],s:it.str})).filter(it=>it.s.trim());
  its.sort((a,b)=> b.y-a.y || a.x-b.x);
  const out=[];let cur=null;
  for(const it of its){if(!cur||Math.abs(it.y-cur.y)>3){cur={y:it.y,parts:[]};out.push(cur);}cur.parts.push(it);}
  return out.map(l=>l.parts.sort((a,b)=>a.x-b.x).map(p=>p.s).join(' '));}
function nums(s){const m=s.replace(/,/g,'').match(/-?\d+(?:\.\d+)?/g);return m?m.map(Number):[];}
// Parse the FIRST "Table of Boat Speed Polars" (page 2 boat polar, not the page-3 fleet-adjusted copy).
function parseORR(lines){
  let i=lines.findIndex(l=>/Table of Boat Speed Polars/i.test(l));
  if(i<0) throw new Error('No \u201cTable of Boat Speed Polars\u201d found \u2014 is this an ORR certificate?');
  let tws=null,beatA=null,beatS=null;const twa=[],speed=[];
  for(let j=i+1;j<lines.length;j++){const L=lines[j];
    if(/Table of (Time Allowances|Boat Speed Polars)/i.test(L)) break;       // end of this table
    if(/True Wind Speed/i.test(L)){tws=nums(L);continue;}
    if(/Up Angle/i.test(L)){beatA=nums(L);continue;}
    if(/Speed\s*Up\s*kts/i.test(L)){beatS=nums(L);continue;}
    if(/Speed\s*Dn\s*kts|Dn Angle/i.test(L)) continue;
    const m=L.match(/^\s*(\d{2,3})\s*\u00b0/);                                 // TWA data row e.g. "52\u00b0 ..."
    if(m){const v=nums(L);if(v.length>=2){twa.push(+m[1]);speed.push(v.slice(1));}}}
  if(!tws||!beatA||!beatS) throw new Error('Could not read the wind / angle / speed header rows');
  const n=tws.length;
  if(beatA.length!==n||beatS.length!==n) throw new Error('Up-angle columns ('+beatA.length+') do not match wind speeds ('+n+')');
  if(twa.length<4) throw new Error('Only '+twa.length+' wind-angle rows found');
  const speedN=speed.map(r=>r.slice(0,n));
  if(speedN.some(r=>r.length!==n)) throw new Error('A speed row has the wrong number of columns');
  return {tws,twa,speed:speedN,beat:{angle:beatA,speed:beatS}};}

    for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();lines=lines.concat(linesFromContent(tc.items));}

// Re-plan. GFS only updates every 6h (00/06/12/18 UTC), so within a forecast window the
// data is identical and is fetched ONCE for the whole corridor, then cached. Rerouting
// re-runs the router against the cached grid from the new start position -- no upstream
// call until the model cycle rolls over. This is the client-side half of "don't hammer
// the source"; a real multi-user app shares one such cache server-side (see notes).
let inflight=null, reqSeq=0, CACHE=null, LIVE_OFF=false;  // CACHE={cycle,env}; LIVE_OFF once live is known unavailable
// Latest GFS cycle that should be on the server now: 6h cadence, ~5h availability lag.
function expectedCycle(){const d=new Date(Date.now()-5*3600e3),h=Math.floor(d.getUTCHours()/6)*6;
  return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),h)/1000;}
function cycLabel(c){return new Date(c*1000).toISOString().slice(0,13).replace('T',' ')+'Z';}
function applyEnv(env){SAMPLER=makeSampler(env);FIELD='live';EPOCH0=env.epoch0;HORIZON_H=env.marineHorizonHours;MAXT=env.times[env.times.length-1];}
async function replan(){
  const seq=++reqSeq, cyc=expectedCycle();
  if(CACHE && CACHE.cycle===cyc){                         // same forecast window -> reuse, zero upstream calls
    applyEnv(CACHE.env);
    setStatus('\u25c9 live \u00b7 cached \u00b7 GFS '+cycLabel(cyc)+' (no refetch)','live');setupSlider(true);
    compute();return;
  }
  if(LIVE_OFF){ FIELD='synthetic'; setStatus('\u25c9 demo \u00b7 synthetic field (live unavailable)','demo'); setupSlider(false); compute(); return; }
  setStatus('\u25cc fetching live forecast\u2026','load');
  let env=null, hardFail=false;
  try{
    if(inflight) inflight.abort();
    const ctrl=new AbortController(); inflight=ctrl;
    const to=setTimeout(()=>ctrl.abort(),15000);
    env=await fetchForecastGrid({start:SF,dest:DEST,step:1.5,signal:ctrl.signal}); // FIXED corridor -> reusable by every reroute
    clearTimeout(to);
  }catch(e){ hardFail=(e.name!=='AbortError'); }          // ignore aborts (superseded reroutes)
  if(seq!==reqSeq) return;                                // a newer reroute is in charge
  if(env){
    CACHE={cycle:cyc,env};applyEnv(env);
    setStatus('\u25c9 live \u00b7 GFS + marine \u00b7 '+cycLabel(cyc),'live');setupSlider(true);
  }else if(hardFail){
    if(SAMPLER){ setStatus('\u25c9 live \u00b7 last forecast (refetch failed)','live'); }
    else { FIELD='synthetic'; LIVE_OFF=true; setStatus('\u25c9 demo \u00b7 synthetic field (live unavailable)','demo'); setupSlider(false); }
  }
  compute();
}

function routeFromLocation(){

  geoModal('<div class="geo-note wait">\u25cc Requesting your location\u2026 allow access when your browser asks.</div>');

    const lat=p.coords.latitude, lon=p.coords.longitude;

    origin={lat:+lat.toFixed(2),lon:+lon.toFixed(2)};

      const opt=Math.round(bearing(result.track[0],result.track[1]));   // boat-specific, wind-aware first-leg heading
      const eta=(result.hours/24).toFixed(1);
      const off=Math.round(((opt-direct+540)%360)-180);                 // signed offset from the rhumb line
      geoModal(posRows(lat,lon)
        +geoRow('Optimal heading',opt+'\u00b0T',true)
        +geoRow('Direct bearing',direct+'\u00b0T')
        +geoRow('Distance',dist.toLocaleString()+' nm')
        +geoRow('ETA',eta+' days')
        +'<div class="geo-note ok">\u25b8 Routed for the '+boatName()+'. Optimal heading is '
          +(Math.abs(off)>=1?(Math.abs(off)+'\u00b0 '+(off>0?'right':'left')+' of the direct line'):'on the direct line')
          +' \u2014 close this to see the track.</div>');

        +geoRow('Bearing to dest',direct+'\u00b0T',true)
        +geoRow('Distance',dist.toLocaleString()+' nm')
        +'<div class="geo-note warn">Couldn\u2019t compute a full route from here \u2014 showing the direct bearing.</div>');
    }
  }, function(err){
    const m={1:'Location permission was denied. Enable it in your browser\u2019s site settings, then try again.',
             2:'Your position is unavailable right now. With a clear view of the sky, try again.',
             3:'The location request timed out. Please try again.'};
    geoModal('<div class="geo-note err">'+(m[err.code]||'Could not get your location.')+'</div>');
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}

async function maybeResolve(){
  if(solving)return;
  const moved=lastSolve?distNm(livePos,lastSolve):Infinity, aged=lastSolve?(Date.now()-lastSolve.t):Infinity;
  if(!(moved>=RESOLVE_NM||aged>=RESOLVE_MS))return;
  if(!inChart(livePos.lat,livePos.lon)||maskLand(livePos.lat,livePos.lon))return;   // off-corridor: marker only
  solving=true; origin={lat:+livePos.lat.toFixed(2),lon:+livePos.lon.toFixed(2)};

  livePos={lat:p.coords.latitude,lon:p.coords.longitude};
  liveCog=p.coords.heading; liveSog=p.coords.speed;
  placeBoatDot(); draw();
  const off=!inChart(livePos.lat,livePos.lon)||maskLand(livePos.lat,livePos.lon);
  updateHud(off?'Outside the charted SF\u2013Hawaii corridor \u2014 marker only.':'', off?'err':'');
  maybeResolve();
}
function onWatchErr(err){
  const m={1:'Permission denied \u2014 enable location in your browser\u2019s site settings.',
           2:'Position unavailable right now.',3:'Location request timed out; still trying\u2026'};
  hudErr(m[err.code]||'Could not get your location.');
  if(err.code===1) stopTracking();
}
function startTracking(){
  if(!navigator.geolocation){ hudErr('This browser can\u2019t share a location.'); return; }
  document.getElementById('livehud').hidden=false;
  document.getElementById('hud-body').innerHTML='<div class="hnote">\u25cc Acquiring GPS\u2026 allow access when your browser asks.</div>';
  const btn=document.getElementById('track'); btn.classList.add('active'); btn.textContent='\u25a0 Stop tracking';
  lastSolve=null; solving=false;
  watchId=navigator.geolocation.watchPosition(onFix,onWatchErr,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
}
function stopTracking(){
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  livePos=null; liveCog=liveSog=null;
  document.getElementById('boatdot').hidden=true; document.getElementById('livehud').hidden=true;
  const btn=document.getElementById('track'); btn.classList.remove('active'); btn.textContent='\u25b6 Track my position';
  draw();
}
document.getElementById('track').addEventListener('click',function(){ watchId==null?startTracking():stopTracking(); });
setupBoats();
init();
</script>
